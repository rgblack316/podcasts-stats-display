<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podcast stats</title>
<style>
:root{--ink:#0f1a24;--line:#243746;--text:#e9f0f5;--mute:#8fa5b5;--signal:#ffb23e}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(100vw / 96);background:var(--ink);color:var(--text);cursor:none}
body{font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;height:100vh;overflow:hidden;
  padding:1.6rem 2.4rem;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;gap:1.4rem}
header{display:flex;align-items:center;gap:1.2rem}
header img{width:4rem;height:4rem;border-radius:.5rem;object-fit:cover}
h1{font-size:2.4rem;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager{display:flex;gap:.6rem}
.pager span{font-size:1rem;color:var(--mute);padding:.25rem .8rem;border:1px solid var(--line);border-radius:2rem}
.pager .on{color:var(--ink);background:var(--signal);border-color:var(--signal)}
.stage{display:grid;grid-template-columns:17rem minmax(0,1fr);gap:2rem;min-height:0}
.nums{display:flex;flex-direction:column;justify-content:center;gap:1.4rem;min-width:0}
.nums small{display:block;font-size:1rem;color:var(--mute)}
.nums b{display:block;font-size:3.6rem;font-weight:600;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.nums .a b{color:var(--signal)}
.wave{display:flex;flex-direction:column;min-height:0;min-width:0}
svg{flex:1;min-height:0;width:100%}
.bar{fill:var(--signal);transform-box:fill-box;transform-origin:center;animation:grow .7s ease-out both}
@keyframes grow{from{transform:scaleY(0)}}
.axis{display:flex;justify-content:space-between;font-size:.95rem;color:var(--mute);margin-top:.4rem}
.latest{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2rem;align-items:center;border-top:1px solid var(--line);margin-top:1rem;padding-top:.8rem}
.latest[hidden]{display:none}
.latest small{display:block;font-size:1rem;color:var(--mute)}
.latest .t{font-size:1.5rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.latest .w{display:flex;gap:2.4rem}
.latest .w b{display:block;font-size:2.2rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.all{color:var(--mute);font-size:.9rem;min-width:7.4rem;text-align:right}
.lists{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2.4rem}
h2{font-size:1.15rem;font-weight:500;color:var(--mute);padding-bottom:.4rem;border-bottom:1px solid var(--line);margin-bottom:.4rem}
li{list-style:none;display:grid;grid-template-columns:1fr auto;gap:.2rem 1rem;font-size:1.15rem;padding:.25rem 0}
li{font-variant-numeric:tabular-nums}
li span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
li span:nth-child(2){display:flex;justify-content:flex-end;align-items:baseline;gap:.9rem}
li i{grid-column:1/-1;height:.18rem;background:var(--line);position:relative}
li i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--signal);opacity:.7}
.note{font-size:1rem;color:var(--mute)}
.issues{grid-row:2/4;align-self:start;max-width:80rem}
.issues[hidden],.stage[hidden],.lists[hidden]{display:none}
.issues h2{font-size:1.6rem;color:var(--signal);border:0;margin-bottom:1rem}
.issues li{display:block;font-size:1.3rem;line-height:1.35;padding:.45rem 0}
.issues li b{font-weight:600}
.issues p{font-size:1.2rem;color:var(--mute);margin-top:1.4rem}
.status{position:fixed;right:2.4rem;bottom:.5rem;max-width:65vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9rem;color:var(--mute)}
.status.warn{color:var(--signal)}
@media (prefers-reduced-motion:reduce){.bar{animation:none}}
</style>
</head>
<body>
<header><img id="art" alt="" referrerpolicy="no-referrer"><h1 id="title"></h1><div class="pager" id="pager"></div></header>
<main class="stage">
  <div class="nums" id="nums"></div>
  <div class="wave"><svg id="wave" viewBox="0 0 1200 300" preserveAspectRatio="none" role="img" aria-label="Daily downloads, last 30 days"></svg>
    <div class="axis"><span>30 days ago</span><span>Today</span></div>
    <div class="latest" id="latest" hidden><div><small id="lsub"></small><div class="t" id="lt"></div></div><div class="w" id="lw"></div></div></div>
</main>
<section class="lists" id="lists"></section>
<section class="issues" id="issues" hidden></section>
<div class="status" id="status"></div>
<script>
const NS = "http://www.w3.org/2000/svg";
let data = null, idx = 0, failed = false, timers = {};
const $ = id => document.getElementById(id);
const fmt = n => n == null ? "–" : Math.round(n).toLocaleString();
function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function stat(cls, label, value, pre) { const d = h("div", cls); d.append(h("small", "", label), h("b", "", (value == null ? "" : pre || "") + fmt(value))); return d; }

function list(title, rows) {
  const s = h("div"); s.append(h("h2", "", title));
  if (!rows.length) { s.append(h("p", "note", "No data yet")); return s; }
  const ul = h("ul"), max = Math.max(...rows.map(r => r.value), 1);
  for (const r of rows) {
    const right = h("span", "", fmt(r.value));
    if (r.lifetime != null) right.append(h("small", "all", fmt(r.lifetime) + " lifetime"));
    const li = h("li"); li.append(h("span", "", r.label), right);
    const bar = h("i"); bar.style.setProperty("--w", (r.value / max * 100) + "%"); li.append(bar); ul.append(li);
  }
  s.append(ul); return s;
}

function wave(show) {
  const svg = $("wave"); svg.replaceChildren();
  const vals = show.trend.map(r => r.value);
  const n = Math.max(vals.length, 1), max = Math.max(...vals, 1), w = 1200 / n;
  vals.forEach((v, i) => {
    const r = document.createElementNS(NS, "rect"), hh = Math.max(v / max * 140, 2);
    r.setAttribute("class", "bar"); r.setAttribute("x", i * w + w * .2); r.setAttribute("width", w * .6);
    r.setAttribute("y", 150 - hh); r.setAttribute("height", hh * 2); r.setAttribute("rx", 3);
    r.style.animationDelay = (i * 18) + "ms"; svg.append(r);
  });
}

let regionNames = null;
try { regionNames = new Intl.DisplayNames(["en"], { type: "region" }); } catch (e) {}
const country = c => { try { return (regionNames && regionNames.of(c)) || c; } catch (e) { return c; } };

function fit() {
  for (const b of document.querySelectorAll(".nums b")) {
    b.style.fontSize = "";
    let px = parseFloat(getComputedStyle(b).fontSize);
    while (b.scrollWidth > b.clientWidth && px > 24) { px -= 2; b.style.fontSize = px + "px"; }
  }
}

const errors = () => (data.config_problems || []).filter(p => p.level === "error");
const slideCount = () => data.shows.length + (errors().length || !data.shows.length ? 1 : 0);

function renderIssues(n) {
  const errs = errors(), box = $("issues");
  $("title").textContent = "Setup needed"; $("art").hidden = true;
  $("pager").replaceChildren(...data.shows.map(x => h("span", "", x.name)), h("span", "on", "Setup"));
  box.replaceChildren(h("h2", "", errs.length ? "These settings need fixing" : "No shows yet"));
  if (errs.length) {
    const ul = h("ul");
    for (const p of errs) { const li = h("li"); if (p.show) li.append(h("b", "", p.show + ": ")); li.append(p.message); ul.append(li); }
    box.append(ul);
  }
  box.append(h("p", "", "Open http://" + location.host + "/settings to fix this."));
  const st = $("status"); st.className = "status warn"; st.textContent = "Showing the shows that are set up correctly"; st.title = "";
  if (!data.shows.length) st.textContent = "";
}

function render() {
  if (!data) return;
  const n = slideCount();
  if (!n) return;
  const onIssues = idx % n === data.shows.length;
  document.querySelector(".stage").hidden = onIssues; $("lists").hidden = onIssues; $("issues").hidden = !onIssues;
  if (onIssues) return renderIssues(n);
  const s = data.shows[idx % n];
  $("title").textContent = s.title;
  const art = $("art"); art.onerror = () => { art.hidden = true; };
  art.hidden = !s.image; if (s.image) art.src = s.image; else art.removeAttribute("src");
  $("pager").replaceChildren(...data.shows.map((x, i) => h("span", i === idx % n ? "on" : "", x.name)).concat(n > data.shows.length ? [h("span", "", "Setup")] : []));
  const more = s.truncated ? "\u2265 " : "";
  $("nums").replaceChildren(stat("a", "Downloads, 30 days", s.downloads, more),
    stat("", "Unique listeners, 30 days", s.listeners, more),
    stat("", "Lifetime downloads", s.lifetime && s.lifetime.value, s.lifetime && s.lifetime.approx ? "\u2265 " : ""));
  fit(); wave(s);
  const L = s.latest; $("latest").hidden = !L;
  if (L) {
    $("lsub").textContent = "Latest episode, published " + new Date(L.published).toLocaleDateString([], { month: "short", day: "numeric" });
    $("lt").textContent = L.title || "Untitled";
    $("lw").replaceChildren(...L.windows.map(w => stat("", w.label + (w.partial ? ", so far" : ""), w.value)));
  }
  $("lists").replaceChildren(list("Top episodes, 30 days", s.episodes), list("Podcast apps, 3 months", s.apps),
    list("Countries, 30 days", s.countries.map(r => ({ label: country(r.label), value: r.value }))));
  const age = Date.now() / 1000 - data.updated, stale = !data.updated || age > data.interval_hours * 7200;
  const st = $("status");
  st.className = "status" + (stale || failed || s.problem ? " warn" : "");
  st.textContent = failed ? "Can't reach the stats server. Retrying." :
    s.problem ? s.name + ": " + s.problem :
    stale ? "Data is out of date. Check the server logs." :
    "Updated " + new Date(data.updated * 1000).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
  st.title = st.textContent;
}

async function load() {
  try { const r = await fetch("/api/dashboard"); if (!r.ok) throw 0; data = await r.json(); failed = false; }
  catch (e) { failed = true; }
  schedule(); render();
}

// How long each show stays up, and how often data is re-read, come from the settings page.
function schedule() {
  const slide = ((data && data.slide_seconds) || 60) * 1000, reload = ((data && data.reload_minutes) || 15) * 60000;
  if (timers.slide !== slide) { clearInterval(timers.slideId); timers.slide = slide; timers.slideId = setInterval(() => { idx++; render(); }, slide); }
  if (timers.reload !== reload) { clearInterval(timers.reloadId); timers.reload = reload; timers.reloadId = setInterval(load, reload); }
}
load();
</script>
</body>
</html>
